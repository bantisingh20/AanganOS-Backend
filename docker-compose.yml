services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: communityos-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CommunityOS!Dev2026"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - communityos-sql-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  communityos-sql-data:
